[Sparking.Watch]
# Memory watcher (see Docs/SPARKING.md). Each side's health in percent, 0-100 (float), read-only;
# in Team Battle the whole team's. The same battle struct as PAL's (RDSPAF 0x803CF6C0, cleared
# 0x1a00 bytes by 0x8008eb4c; here 0x803CDFC0, by 0x8008e360), percentages at +0x1964 / +0x1968.
# Checked in a JP battle dump (100.0 / 92.47).
p1_health_pct = f32 0x803CF924
p2_health_pct = f32 0x803CF928

[Sparking.Trigger]
# Fire once when the condition becomes true: that side's (whole team's) health hit 0.
p1_defeated = p1_health_pct <= 0
p2_defeated = p2_health_pct <= 0

[Sparking.Modes]
# Netplay lobby mode -> battle state everyone boots into (file in --state-dir). Captured offline
# with the netplay save and this version's default codes only, no splitscreen remover
# (SparkingData\3_capture_battle_states.bat, version RDSJAF; Tools/sparking_state_check.py checks
# it). Until a file exists, that mode's lobbies boot to the game's menus.
Single = RDSJAF-SingleBattle.sst
Team = RDSJAF-TeamBattle.sst
Training = RDSJAF-BufferTraining.sst
