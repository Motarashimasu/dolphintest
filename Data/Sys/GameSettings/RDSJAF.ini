[Sparking.Modes]
# Netplay lobby mode -> battle state everyone boots into (file in --state-dir). Captured offline
# with the netplay save and this version's default codes only, no splitscreen remover
# (SparkingData\3_capture_battle_states.bat, version RDSJAF; Tools/sparking_state_check.py checks
# it). Until a file exists, that mode's lobbies boot to the game's menus.
Single = RDSJAF-SingleBattle.sst
Team = RDSJAF-TeamBattle.sst
Training = RDSJAF-BufferTraining.sst
