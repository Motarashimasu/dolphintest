# RDBJAF - Dragon Ball Z Sparking! NEO (Budokai Tenkaichi 2, NTSC-J)

[Gecko]
# Splitscreen removers (found in this version's main.dol; see Docs/SPARKING.md > Gecko codes).
# Battle setup sets the "2 players" flag (bit 0x2 of the game's mode word, -0x74a8(r13)+0x4dc)
# whenever both sides are human; with it set, the camera code splits the screen in two. The four
# setters (one per battle menu) are nop'd, so the battle runs as one full-screen view, like BT3's
# remover. Both players' inputs are still read as usual.
# Camera 0 is the one drawn; the per-frame camera loop (0x80067480) gives camera i to player i.
# Player 2's code swaps that, so their screen follows their own fighter.
$Player 1 Splitscreen Remover
*Netplay only - enabled automatically for the player on GameCube port 1.
041530D4 60000000
04159064 60000000
0417B340 60000000
04204A98 60000000
$Player 2 Splitscreen Remover
*Netplay only - enabled automatically for the player on GameCube port 2.
041530D4 60000000
04159064 60000000
0417B340 60000000
04204A98 60000000
04067488 38600001
040674A0 38600000
