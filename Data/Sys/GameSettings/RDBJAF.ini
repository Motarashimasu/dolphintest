[Sparking.Watch]
# Memory watcher (see Docs/SPARKING.md). Each side's health in percent, 0-100: current HP / max HP.
# The fighters are 0x1560-byte structs in MEM2 from the pointer at 0x805F3210 (r13-0x72f0, what
# the game's 0x8008c4b8 reads): P1's at [[0x805F3210]], P2's right after it. In each: +0x11D8
# current HP (u32), +0x11DC the bar's lagging "damage" value, +0x11E0 max HP (30000 / 50000 ...).
# Found by the user (P1 0x924D1378, P2 0x924D28D8 in one battle) and checked in a battle dump
# (P1 50000 / 50000, P2 29170 / 30000 = the small red chunk on P2's bar). Outside a battle the
# pointer is empty and the values read as null.
p1_health_pct = u32 0x805F3210 > 0x0 > 0x11D8 / u32 0x805F3210 > 0x0 > 0x11E0 * 100
p2_health_pct = u32 0x805F3210 > 0x0 > 0x2738 / u32 0x805F3210 > 0x0 > 0x2740 * 100

[Sparking.Trigger]
# Fire once when the condition becomes true: that side's health hit 0.
p1_defeated = p1_health_pct <= 0
p2_defeated = p2_health_pct <= 0
