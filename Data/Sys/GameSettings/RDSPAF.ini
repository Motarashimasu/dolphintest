[Sparking.Watch]
# Memory watcher (see Docs/SPARKING.md). Each side's health in percent, 0-100 (float), read-only
# (the game recomputes it every frame). In Team Battle it is the WHOLE team's combined health,
# so it only reaches 0 when that side has lost the match. Verified in Single and Team Battle.
p1_health_pct = f32 0x803D1024
p2_health_pct = f32 0x803D1028

[Sparking.Trigger]
# Fire once when the condition becomes true: that side's (whole team's) health hit 0.
p1_defeated = p1_health_pct <= 0
p2_defeated = p2_health_pct <= 0

[Sparking.Modes]
# Netplay lobby mode -> battle state everyone boots into (file in --state-dir).
Single = RDSPAF-SingleBattle.sav
Team = RDSPAF-TeamBattle.sst
Training = RDSPAF-BufferTraining.sst
