# Linux build of Dolphin-Sparking (dolphin-emu-nogui + Sys) for players: Docs/LINUX.md.
#
# Built on Ubuntu 22.04 so it runs on most Linux systems of the last years (glibc 2.35+: Ubuntu
# 22.04+, Debian 12+, Fedora 36+, SteamOS 3 / Steam Deck, Arch...). Dolphin's own copies of its
# libraries (USE_SYSTEM_LIBS=OFF) and a static libstdc++, so it only needs what every desktop
# has: X11 (or XWayland), libudev (controllers), PulseAudio or ALSA (sound); libevdev comes along
# in Dolphin/lib (not every system has it).
#
# Run it: GitHub > Actions > "Linux build" > Run workflow (it also runs on pushes that change
# Dolphin). The result is the artifact "dolphin-sparking-linux-x86_64": a .tar.gz of the Dolphin
# folder to put next to the Linux launcher.
#
# No secrets here, on purpose: this repository is public, and so are its build artifacts (any
# GitHub user can download them). The encrypted Linux Godot template (it holds the .pck key) is
# built on your own PC instead: Tools/build_encrypted_template_linux.sh.
name: Linux build

on:
  workflow_dispatch:
  push:
    branches: ["sparking/**"]
    paths:
      - "Source/**"
      - "Data/Sys/**"
      - "Externals/**"
      - "CMake/**"
      - "CMakeLists.txt"
      - ".github/workflows/linux.yml"

# The workflow's GitHub token can only read the code (nothing here pushes, comments or releases).
permissions:
  contents: read

concurrency:   # a newer push replaces a build still running for the same branch
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dolphin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false   # (the token isn't left in .git for later steps)

      - name: Submodules (the ones Linux uses)
        run: |
          # Not: Windows' Qt and FFmpeg binaries, Android's driver tools, the unit test framework,
          # GBA link (mGBA) and RetroAchievements (switched off below: BT2 / BT3 use neither).
          for p in $(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            case "$p" in
              Externals/Qt|Externals/FFmpeg-bin|Externals/libadrenotools|Externals/gtest|\
              Externals/mGBA/mgba|Externals/rcheevos/rcheevos) continue ;;
            esac
            git submodule update --init --recursive --depth 1 "$p"
          done

      - name: Build tools and system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-12 ninja-build pkg-config patchelf \
            libx11-dev libxrandr-dev libxi-dev libxext-dev libegl-dev libgl-dev \
            libevdev-dev libudev-dev libpulse-dev libasound2-dev

      - name: Configure
        run: |
          set -o pipefail
          # On failure, CMake's errors also go to the run's summary (annotations).
          trap 'grep -A12 "CMake Error" cfg.log | head -60 | sed ":a;N;\$!ba;s/%/%25/g;s/\n/%0A/g" | sed "s/^/::error title=CMake::/"' ERR
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DUSE_SYSTEM_LIBS=OFF \
            -DENABLE_QT=OFF -DENABLE_NOGUI=ON -DENABLE_TESTS=OFF \
            -DENABLE_LLVM=OFF -DENABLE_BLUEZ=OFF -DENABLE_AUTOUPDATE=OFF -DENABLE_ANALYTICS=OFF \
            -DENCODE_FRAMEDUMPS=OFF -DUSE_MGBA=OFF -DUSE_RETRO_ACHIEVEMENTS=OFF \
            -DENABLE_X11=ON -DENABLE_EGL=ON -DENABLE_EVDEV=ON \
            -DENABLE_CUBEB=ON -DENABLE_PULSEAUDIO=ON -DENABLE_ALSA=ON 2>&1 | tee cfg.log

      - name: Build
        run: cmake --build build --target dolphin-nogui dolphin-tool -j "$(nproc)"

      - name: Check what it needs from the system
        run: |
          for bin in build/Binaries/dolphin-emu-nogui build/Binaries/dolphin-tool; do
            echo "$bin shared libraries:"; ldd "$bin" | awk '{print "  " $1}'
            echo "Newest glibc symbol:"; objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
            if ldd "$bin" | grep -Eq 'libLLVM|libQt|libav|libstdc\+\+'; then
              echo "::error::$bin linked a library players may not have"; exit 1
            fi
          done

      - name: Package the Dolphin folder
        run: |
          mkdir -p out/Dolphin/lib
          cp build/Binaries/dolphin-emu-nogui build/Binaries/dolphin-tool out/Dolphin/
          cp -r Data/Sys out/Dolphin/Sys
          chmod 755 out/Dolphin/dolphin-emu-nogui out/Dolphin/dolphin-tool
          # libevdev (controllers) isn't on every Linux (WSL, minimal installs: "error while
          # loading shared libraries: libevdev.so.2"): it comes along in Dolphin/lib, found
          # through the programs' RUNPATH ($ORIGIN/lib), before the system's.
          for lib in libevdev.so.2; do
            src=$(ldd build/Binaries/dolphin-emu-nogui | awk -v l="$lib" '$1 == l {print $3}')
            [ -n "$src" ] || { echo "::error::$lib not found"; exit 1; }
            cp -L "$src" out/Dolphin/lib/
            echo "Bundled $lib (from $src):"; ldd "out/Dolphin/lib/$lib" | awk '{print "  " $1}'
          done
          patchelf --set-rpath '$ORIGIN/lib' out/Dolphin/dolphin-emu-nogui out/Dolphin/dolphin-tool
          readelf -d out/Dolphin/dolphin-emu-nogui | grep -E 'RUNPATH|RPATH'
          # Check the loader really picks the bundled copy (RUNPATH comes before the system's).
          ldd out/Dolphin/dolphin-emu-nogui | grep -E 'libevdev\.so\.2 => .*/Dolphin/lib/' \
            || { echo "::error::the bundled libevdev isn't the one loaded"; exit 1; }
          tar -C out -czf dolphin-sparking-linux-x86_64.tar.gz Dolphin

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-sparking-linux-x86_64
          path: dolphin-sparking-linux-x86_64.tar.gz
          retention-days: 30
